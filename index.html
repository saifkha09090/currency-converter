<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://saifkha09090.github.io/currency-converter" />
  <title>Currency Converter - Free Online USD, EUR, GBP Exchange Tool</title>
  <meta name="description" content="Free currency converter for USD, EUR, JPY, GBP and more. Get fast, real-time exchange rates and convert amounts instantly with this easy-to-use tool." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="converter-container">
    <h1>Currency Converter</h1>
    
    <div class="popular-section">
      <h3>🌍 Popular Currencies</h3>
      <div class="popular-tags">
        <span>USD - United States Dollar</span>
        <span>EUR - Euro</span>
        <span>JPY - Japanese Yen</span>
        <span>GBP - British Pound</span>
      </div>
    </div>

    
    <div class="converter-box">
      <div class="input-group">
        <label for="amount">Amount</label>
        <input type="number" id="amount" placeholder="Enter amount" />
      </div>

      <div class="dropdowns">
        <div class="input-group">
          <label for="from-currency">From</label>
          <select id="from-currency"></select>
        </div>
        <div class="input-group">
          <label for="to-currency">To</label>
          <select id="to-currency"></select>
        </div>
      </div>
      <p id="rate"></p>

      <button id="convert-btn">Convert</button>
      <div class="result" id="result">Converted amount will appear here.</div>
    </div>

  </div>

  <script src="countrylist.js"></script>
  <script src="app.js"></script>
</body>
</html>
